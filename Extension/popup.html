<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="ui.css">
<style>
  body { width: 260px; padding: 14px; }
  h1 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 20px; height: 20px; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); gap: 10px; }
  .row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); font-size: 12px; }
  button.link { margin-top: 10px; width: 100%; }
</style>
</head>
<body>
  <h1><img src="images/icon-48.png" alt="">HoverLens</h1>
  <label class="row"><span>Enabled</span><input type="checkbox" id="enabled" class="switch"></label>
  <label class="row" id="siteRow"><span>On <b id="host"></b></span><input type="checkbox" id="site" class="switch"></label>
  <p class="muted" id="note"></p>
  <button class="link" id="settings">Settings &amp; shortcuts…</button>
  <script src="defaults.js"></script>
  <script src="popup.js"></script>
</body>
</html>
